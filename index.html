<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文学手记</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Noto Serif SC", "Source Han Serif SC", "SimSun", serif;
    background: #f5f0e8;
    color: #3a3a3a;
    line-height: 1.9;
  }
  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 60px 24px;
  }
  header {
    text-align: center;
    padding-bottom: 40px;
    border-bottom: 1px solid #d4c9b5;
    margin-bottom: 50px;
  }
  header h1 {
    font-size: 2.2em;
    font-weight: normal;
    letter-spacing: 0.3em;
    color: #5c4a3a;
    margin-bottom: 12px;
  }
  header .subtitle {
    font-size: 0.95em;
    color: #8a7b6b;
    letter-spacing: 0.1em;
  }
  .quote {
    background: #ede6d8;
    border-left: 3px solid #b8a080;
    padding: 24px 28px;
    margin: 40px 0;
    font-style: italic;
    color: #5c4a3a;
  }
  .quote .author {
    display: block;
    text-align: right;
    margin-top: 12px;
    font-size: 0.9em;
    color: #8a7b6b;
  }
  section {
    margin-bottom: 50px;
  }
  section h2 {
    font-size: 1.4em;
    font-weight: normal;
    color: #5c4a3a;
    margin-bottom: 20px;
    padding-bottom: 10px;
    border-bottom: 1px dashed #c9b99a;
  }
  .entry {
    margin-bottom: 28px;
  }
  .entry .title {
    font-size: 1.1em;
    color: #6b5540;
    margin-bottom: 6px;
  }
  .entry .date {
    font-size: 0.85em;
    color: #a89880;
    margin-bottom: 10px;
  }
  .entry p {
    text-indent: 2em;
    color: #4a4a4a;
  }
  footer {
    text-align: center;
    padding-top: 40px;
    border-top: 1px solid #d4c9b5;
    font-size: 0.85em;
    color: #a89880;
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <h1>文学手记</h1>
    <div class="subtitle">— 文字是随身携带的避难所 —</div>
  </header>

  <div class="quote">
    "我们所有的人，都在阴沟里，但仍有人仰望星空。"
    <span class="author">—— 王尔德</span>
  </div>

  <section>
    <h2>近期书摘</h2>
    <div class="entry">
      <div class="title">《夜晚的潜水艇》</div>
      <div class="date">陈春成</div>
      <p>我在暗蓝色的海上漂流，海水在暮色中变得像一块旧绸子。这艘潜水艇是我的，谁也不知道它的存在，我要开着它去海底，看珊瑚丛里的宫殿。</p>
    </div>
    <div class="entry">
      <div class="title">《人间失格》</div>
      <div class="date">太宰治</div>
      <p>胆小鬼连幸福都会害怕，碰到棉花都会受伤，有时也会被幸福所伤。</p>
    </div>
  </section>

  <section>
    <h2>随笔</h2>
    <div class="entry">
      <div class="title">深夜读书记</div>
      <div class="date">2026.10.15</div>
      <p>窗外下着小雨，台灯暖黄。翻到某一页，忽然被一句话击中——原来有些人写下的不是字，是时间的碎片，刚好落在你此刻的心事上。</p>
    </div>
  </section>

  <footer>
    © 2026 文学手记 · 用文字记录生活
  </footer>

</div>
</body>
</html>
