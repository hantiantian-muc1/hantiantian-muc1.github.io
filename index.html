<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>韩中互译</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    width: 100%;
    max-width: 900px;
    overflow: hidden;
  }
  .header {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    padding: 24px 32px;
    text-align: center;
  }
  .header h1 { font-size: 1.5em; font-weight: 600; letter-spacing: 2px; }
  .header p { font-size: 0.85em; opacity: 0.8; margin-top: 6px; }
  .lang-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 32px;
    background: #f8f9ff;
    border-bottom: 1px solid #e8e8f0;
  }
  .lang-tag {
    font-size: 0.95em;
    font-weight: 600;
    color: #555;
  }
  .swap-btn {
    background: #667eea;
    color: #fff;
    border: none;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    transition: transform 0.3s;
  }
  .swap-btn:hover { transform: rotate(180deg); }
  .main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
  }
  .panel {
    padding: 20px 24px;
    min-height: 260px;
    display: flex;
    flex-direction: column;
  }
  .panel.left { border-right: 1px solid #eee; }
  textarea {
    width: 100%;
    flex: 1;
    border: none;
    outline: none;
    resize: none;
    font-size: 1.1em;
    line-height: 1.7;
    font-family: inherit;
    color: #333;
    background: transparent;
  }
  textarea::placeholder { color: #bbb; }
  .result {
    flex: 1;
    font-size: 1.1em;
    line-height: 1.7;
    color: #333;
    overflow-y: auto;
  }
  .result.placeholder { color: #bbb; }
  .footer {
    padding: 14px 32px;
    background: #f8f9ff;
    border-top: 1px solid #e8e8f0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.8em;
    color: #999;
  }
  .copy-btn {
    background: none;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 4px 12px;
    cursor: pointer;
    color: #666;
    font-size: 0.85em;
  }
  .copy-btn:hover { background: #f0f0f5; }
  .loading { color: #aaa; font-style: italic; }
  @media (max-width: 600px) {
    .main { grid-template-columns: 1fr; }
    .panel.left { border-right: none; border-bottom: 1px solid #eee; }
  }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <h1>한중 번역기</h1>
    <p>韩中互译 · 在线翻译小工具</p>
  </div>
  <div class="lang-bar">
    <span class="lang-tag" id="langLeft">한국어</span>
    <button class="swap-btn" onclick="swapLang()">⇄</button>
    <span class="lang-tag" id="langRight">中文</span>
  </div>
  <div class="main">
    <div class="panel left">
      <textarea id="inputText" placeholder="여기에 입력하세요..." oninput="debounceTranslate()"></textarea>
    </div>
    <div class="panel right">
      <div class="result placeholder" id="outputText">翻译结果将显示在这里</div>
    </div>
  </div>
  <div class="footer">
    <span>输入即自动翻译 · 由 Google Translate 提供接口</span>
    <button class="copy-btn" onclick="copyResult()">复制结果</button>
  </div>
</div>

<script>
  let leftLang = 'ko';
  let rightLang = 'zh-CN';
  let timer = null;

  function debounceTranslate() {
    clearTimeout(timer);
    timer = setTimeout(translate, 600);
  }

  async function translate() {
    const text = document.getElementById('inputText').value.trim();
    const out = document.getElementById('outputText');
    if (!text) {
      out.textContent = '翻译结果将显示在这里';
      out.classList.add('placeholder');
      return;
    }
    out.textContent = '翻译中...';
    out.classList.remove('placeholder');
    try {
      const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${leftLang}&tl=${rightLang}&dt=t&q=${encodeURIComponent(text)}`;
      const res = await fetch(url);
      const data = await res.json();
      let result = '';
      data[0].forEach(item => { result += item[0]; });
      out.textContent = result;
      out.classList.remove('placeholder');
    } catch (e) {
      out.textContent = '翻译出错了，请检查网络后重试';
    }
  }

  function swapLang() {
    const input = document.getElementById('inputText');
    const output = document.getElementById('outputText');
    const tmp = leftLang;
    leftLang = rightLang;
    rightLang = tmp;
    document.getElementById('langLeft').textContent = leftLang === 'ko' ? '한국어' : '中文';
    document.getElementById('langRight').textContent = rightLang === 'ko' ? '한국어' : '中文';
    input.placeholder = leftLang === 'ko' ? '여기에 입력하세요...' : '在此输入中文...';
    input.value = output.classList.contains('placeholder') ? '' : output.textContent;
    translate();
  }

  function copyResult() {
    const out = document.getElementById('outputText');
    if (out.classList.contains('placeholder')) return;
    navigator.clipboard.writeText(out.textContent).then(() => {
      alert('已复制到剪贴板');
    });
  }
</script>
</body>
</html>
