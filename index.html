<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f7f9fb;
            color: #333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            background: #fff;
            max-width: 640px;
            width: 100%;
            padding: 56px 48px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
            text-align: center;
        }

        /* 照片占位区：换成自己的照片时，替换 img 的 src 即可 */
        .photo {
            width: 160px;
            height: 160px;
            margin: 0 auto 28px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid #eef2f5;
        }

        .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        h1 {
            font-size: 30px;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #6b7a8d;
            font-size: 15px;
            margin-bottom: 28px;
        }

        .divider {
            width: 48px;
            height: 3px;
            background: #4a90d9;
            border-radius: 2px;
            margin: 0 auto 28px;
        }

        .intro {
            font-size: 16px;
            line-height: 1.9;
            color: #555;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- 照片占位区：把 src 换成自己的照片路径即可 -->
        <div class="photo">
            <img src="https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=minimalist%20portrait%20avatar%20of%20a%20young%20person%2C%20soft%20studio%20lighting%2C%20clean%20light%20blue%20background%2C%20friendly%20smile%2C%20professional%20headshot%2C%20high%20quality&image_size=square" alt="个人照片">
        </div>

        <h1>你好，我是小明</h1>
        <p class="subtitle">学生 · 热爱技术与生活</p>

        <div class="divider"></div>

        <p class="intro">
            欢迎来到我的个人主页！我是一名对世界充满好奇的学生，目前专注于计算机视觉与嵌入式系统的学习。
            平时喜欢写代码、读论文，也喜欢在闲暇时跑步和摄影。我相信技术可以让生活变得更美好，
            希望能通过不断的学习与实践，做出真正有价值的东西。
        </p>
    </div>
